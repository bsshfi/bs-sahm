<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>سهم</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سهم">
<meta name="theme-color" content="#0d1210">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png?v=2.0">
<style>
/* Layout: status chip on top; one page at a time in the middle (Home / Qibla share the compass dial,
   Favourites and Settings are scrolling lists); a tab bar fixed to the bottom. */
:root{
  --bg:#0d1210; --bg2:#111815; --panel:#161e1b; --panel2:#1c2622; --line:#25302b; --fg:#eef3ef; --dim:#859790;
  --arrow:#f2c14e; --arrow2:#d99a1e; --good:#4cc38a; --good2:#2f9a68; --ok:#f2c14e; --bad:#e5604f; --onArrow:#1a1404;
  --glow:rgba(242,193,78,.25); --glowG:rgba(76,195,138,.35); --okBg:rgba(242,193,78,.08); --okLine:rgba(242,193,78,.25);
  --badBg:rgba(229,96,79,.08); --badLine:rgba(229,96,79,.5); --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); --bar:rgba(17,24,21,.92);
  --ui:-apple-system,"SF Arabic","Geeza Pro",system-ui,sans-serif;
  --num:-apple-system,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;
  color-scheme:dark;
}
/* light: warm beige paper */
:root[data-theme="light"]{
  --bg:#efe6d6; --bg2:#f7f1e6; --panel:#fbf7ef; --panel2:#f1e8d8; --line:#ded1bb; --fg:#2b241a; --dim:#7b6f5d;
  --arrow:#e2a326; --arrow2:#bf8216; --good:#2f9a68; --good2:#237a52; --ok:#a8730a; --bad:#c4473a; --onArrow:#2b1d04;
  --glow:rgba(191,130,22,.28); --glowG:rgba(47,154,104,.3); --okBg:rgba(226,163,38,.12); --okLine:rgba(191,130,22,.35);
  --badBg:rgba(196,71,58,.07); --badLine:rgba(196,71,58,.45); --shadow:rgba(80,60,30,.18); --scrim:rgba(60,45,25,.35); --bar:rgba(251,247,239,.94);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--panel)}
body{background:radial-gradient(120% 70% at 50% 38%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--fg);font-family:var(--ui);
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
svg{display:block}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top status */
.top{display:flex;align-items:center;gap:10px;padding:12px 0 4px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:4px;border-radius:2px;background:var(--line);transition:background .3s}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:14px}
.chip b{font-size:14px;font-weight:600}
.chip .acc{color:var(--dim);font-size:13px;font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr}
.ptitle{margin-inline-start:auto;font-size:15px;font-weight:700;color:var(--dim)}
.sub{color:var(--dim);font-size:12px;min-height:16px;font-variant-numeric:tabular-nums;padding-inline-start:4px}
.sub .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-inline-end:5px;vertical-align:1px}

/* pages */
main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.page{flex:1;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 0 24px;display:flex;flex-direction:column;gap:12px}
.scroll>*{flex-shrink:0}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

/* dial */
.dial{position:relative;width:min(78vw,40vh);aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:50%}
#bezel{position:absolute;inset:0;transition:transform .25s ease-out}
#bezel svg{width:100%;height:100%}
.tick{stroke:var(--line)}.tick.maj{stroke:var(--dim)}
.card{fill:var(--dim);font:600 12px var(--ui)}
.card.n{fill:var(--bad)}
.face{fill:var(--panel);stroke:var(--line)}
#arrow{position:absolute;inset:20%;transition:transform .25s ease-out;filter:drop-shadow(0 6px 14px var(--glow))}
#arrow svg{width:100%;height:100%}
#arrow .a1{fill:var(--arrow)}#arrow .a2{fill:var(--arrow2)}
.aligned #arrow .a1{fill:var(--good)}.aligned #arrow .a2{fill:var(--good2)}
.aligned #arrow{filter:drop-shadow(0 6px 16px var(--glowG))}
#kaaba{position:absolute;top:3%;left:50%;width:9%;transform:translateX(-50%);display:none}
.qibla #kaaba{display:block}
.flag{position:absolute;inset:20%;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--good);background:var(--panel);font-size:24px;font-weight:700}
.flag svg{width:44%;height:auto}
.arrived #arrow{opacity:0}
.arrived .flag{display:flex;animation:pop .35s ease-out}
.arrived .face{stroke:var(--good)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.navhead{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px}
.dist{font-family:var(--num);font-size:clamp(44px,13vw,68px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.dist small{font-family:var(--ui);font-size:.36em;font-weight:600;color:var(--dim);margin-inline-start:6px;letter-spacing:0}
.meta{color:var(--dim);font-size:14px;text-align:center;min-height:20px}
.meta b{color:var(--fg);font-weight:600}
.warn{font-size:13px;text-align:center}
.warn:not(:empty){color:var(--ok);background:var(--okBg);border:1px solid var(--okLine);border-radius:12px;padding:8px 12px;max-width:420px;line-height:1.5}

/* home idle */
.here{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.loc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.loc .lbl{color:var(--dim);font-size:13px;display:flex;align-items:center;gap:6px}
.coords{direction:ltr;font-family:var(--num);font-size:clamp(24px,7.5vw,34px);font-weight:600;font-variant-numeric:tabular-nums;text-align:center;line-height:1.3;user-select:text;-webkit-user-select:text}
.pill{padding:8px 16px;font-size:14px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.cell div{color:var(--dim);font-size:12px}
.cell b{display:block;font-family:var(--num);font-size:17px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;direction:ltr}

/* controls */
button,input,textarea{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:active{transform:scale(.98)}
button.primary{background:var(--arrow);color:var(--onArrow);border-color:var(--arrow);font-weight:700}
button.danger{background:var(--badBg);border-color:var(--badLine);color:var(--bad);font-weight:700}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--arrow);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
#cancel{width:100%;max-width:440px}

/* favourites */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.item .txt{flex:1;min-width:0}
.item b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.item small{color:var(--dim);display:block;font-size:12.5px;font-family:var(--num);direction:ltr;text-align:start;unicode-bidi:plaintext}
.item .at{color:var(--dim);font-size:11.5px;margin-top:2px;font-family:var(--num);font-variant-numeric:tabular-nums}
.item .acts{display:flex;gap:6px}
.item button{padding:8px 11px;font-size:13px;border-radius:10px}
.item button.del{color:var(--bad)}
.item button.del.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.empty{text-align:center;color:var(--dim);padding:28px 12px;line-height:1.7;background:var(--panel);border:1px dashed var(--line);border-radius:16px}
.sect{font-size:12px;color:var(--dim);padding:4px 4px 0}

/* settings */
.group{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.set{display:flex;flex-direction:column;gap:8px;padding:14px}
.set+.set,.link+.link,.set+.link,.link+.set{border-top:1px solid var(--line)}
.sl{font-size:14px;font-weight:600}
.sh{font-size:12px;color:var(--dim);line-height:1.5}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;font-size:14px;color:var(--dim);border-radius:9px;font-family:var(--num)}
.seg button.on{background:var(--arrow);color:var(--onArrow);font-weight:700}
.seg button:focus-visible{outline:none}
.link{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:0;background:transparent;justify-content:flex-start;font-size:15px;text-align:start}
.link svg{color:var(--arrow);flex:none}
.link .v{margin-inline-start:auto;color:var(--dim);font-family:var(--num);font-size:14px;direction:ltr}
.link .chev{margin-inline-start:auto;width:8px;height:8px;border:solid var(--dim);border-width:0 2px 2px 0;transform:rotate(135deg)}
[dir=ltr] .link .chev{transform:rotate(-45deg)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 120px 0 var(--panel);
  padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar button{flex:1;flex-direction:column;gap:3px;border:0;background:transparent;padding:6px 2px;font-size:11px;color:var(--dim);border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--arrow);font-weight:700}
.tabbar button.on svg{filter:drop-shadow(0 2px 6px var(--glow))}

/* dialogs */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:20px;width:min(92vw,440px);padding:20px;max-height:85vh;overflow:auto}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog h3{margin:0 0 14px;font-size:18px}
dialog label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
dialog input,dialog textarea{width:100%;background:var(--bg)}
dialog .row{margin-top:16px}
.auto{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--dim);font-family:var(--num);font-variant-numeric:tabular-nums}
.auto span{font-family:var(--ui);font-size:12px;opacity:.8}
.about{text-align:center}
.about img{border-radius:18px;box-shadow:0 10px 28px var(--shadow),0 0 0 1px var(--line);margin:4px auto 10px;display:block}
.about .name{font-size:24px;font-weight:700}
.about .name span{font-size:15px;color:var(--dim);font-weight:500;margin-inline-start:4px}
.about .tag{color:var(--dim);font-size:14px;margin-top:2px}
.about p{line-height:1.75;font-size:14.5px;margin:14px 0 0}
.about .credit{margin-top:16px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.about .credit .by{color:var(--dim);font-size:12px}
.about .credit b{display:block;color:var(--arrow);font-size:18px;margin:2px 0}
.about .vpill{display:inline-block;direction:ltr;font-size:11px;color:var(--arrow);border:1px solid var(--okLine);border-radius:999px;padding:2px 10px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:14px;z-index:9;box-shadow:0 8px 24px var(--shadow);white-space:nowrap}

/* start */
#start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:5}
#start h1{margin:0;font-size:34px}
#start p{color:var(--dim);max-width:30ch;line-height:1.7;margin:0}
#start button{min-width:160px}
#start img{border-radius:26px;box-shadow:0 0 0 1px var(--line);filter:drop-shadow(0 10px 24px var(--glow))}
@media (prefers-reduced-motion:reduce){#arrow,#bezel{transition:none}.arrived .flag{animation:none}}
</style>
</head>
<body>

<div id="start">
  <img src="icon.png" alt="" width="112" height="112">
  <h1 data-t="appName">سهم</h1>
  <p data-t="startText"></p>
  <button class="primary" id="go" data-t="start"></button>
</div>

<div class="top">
  <div class="chip">
    <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
    <b id="gpsLabel"></b>
    <span class="acc" id="acc"></span>
  </div>
  <span class="ptitle" id="ptitle"></span>
</div>
<div class="sub" id="fixInfo"></div>

<main>
  <!-- Home + Qibla share this stage -->
  <section class="page stage" id="stage">
    <div class="here" id="here">
      <div class="loc">
        <div class="lbl"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span data-t="yourLoc"></span></div>
        <div class="coords" id="coords">--</div>
        <button class="pill" id="copyHere"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span data-t="copyCoords"></span></button>
      </div>
      <div class="grid">
        <div class="cell"><div data-t="accuracy"></div><b id="hAcc">--</b></div>
        <div class="cell"><div data-t="altitude"></div><b id="hAlt">--</b></div>
        <div class="cell"><div data-t="speed"></div><b id="hSpd">--</b></div>
      </div>
      <div class="row">
        <button class="saveHere"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span data-t="saveHere"></span></button>
        <button class="addCoord"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addCoord"></span></button>
      </div>
    </div>

    <div class="navhead" id="navhead" hidden></div>
    <div class="dial" id="dial" hidden>
      <div id="bezel"><svg viewBox="0 0 200 200" id="bezelSvg"></svg></div>
      <div id="arrow"><svg viewBox="0 0 100 100"><path class="a2" d="M50 4 L86 92 L50 72 Z"/><path class="a1" d="M50 4 L14 92 L50 72 Z"/></svg></div>
      <div class="flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg><span data-t="arrived"></span></div>
    </div>
    <div class="dist" id="dist" hidden>--</div>
    <div class="meta" id="meta" hidden></div>
    <div class="warn" id="warn"></div>
    <button class="danger" id="cancel" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span data-t="cancelNav"></span></button>
  </section>

  <!-- Favourites -->
  <section class="page scroll" id="pFav" hidden>
    <div class="row">
      <button class="saveHere primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span data-t="saveHere"></span></button>
      <button class="addCoord"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addCoord"></span></button>
    </div>
    <div class="list" id="list"></div>
    <div class="sect" data-t="backupSect"></div>
    <div class="row"><button id="backup" data-t="backup"></button><button id="restore" data-t="restore"></button></div>
  </section>

  <!-- Settings -->
  <section class="page scroll" id="pSet" hidden>
    <div class="group">
      <div class="set">
        <div class="sl" data-t="arriveLbl"></div>
        <div class="seg" data-k="arrive"><button data-v="2"></button><button data-v="3"></button><button data-v="5"></button><button data-v="10"></button></div>
        <div class="sh" data-t="arriveHint"></div>
      </div>
      <div class="set">
        <div class="sl" data-t="fmtLbl"></div>
        <div class="seg" data-k="fmt"><button data-v="dec" dir="ltr">24.886000</button><button data-v="dms" dir="ltr">24°53′09.6″N</button></div>
        <div class="sh" data-t="fmtHint"></div>
      </div>
      <div class="set">
        <div class="sl" data-t="themeLbl"></div>
        <div class="seg" data-k="theme"><button data-v="light" data-t="light"></button><button data-v="dark" data-t="dark"></button></div>
      </div>
      <div class="set">
        <div class="sl" data-t="langLbl"></div>
        <div class="seg" data-k="lang"><button data-v="ar">العربية</button><button data-v="en">English</button></div>
      </div>
    </div>
    <div class="group">
      <button class="link" id="share"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span data-t="share"></span><i class="chev"></i></button>
      <button class="link" id="aboutBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span data-t="about"></span><i class="chev"></i></button>
      <div class="link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/></svg><span data-t="version"></span><span class="v">Ver 2.0</span></div>
    </div>
  </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-t="tabSet"></span></button>
  <button data-tab="qibla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 7.5L12 4l8 3.5v9L12 20l-8-3.5z"/><path d="M4 7.5L12 11l8-3.5M12 11v9"/><path d="M4 10.5l8 3.5 8-3.5" stroke-width="1.4"/></svg><span data-t="tabQibla"></span></button>

/* ---------- settings store ---------- */
const cfg={arrive:2,fmt:'dec',theme:'dark',lang:'ar'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('sahm.set')||'{}'))}catch(e){}
delete cfg.sound;
function saveCfg(){try{localStorage.setItem('sahm.set',JSON.stringify(cfg))}catch(e){}}
const T=k=>(L[cfg.lang]||L.ar)[k];
function applyTheme(){document.documentElement.dataset.theme=cfg.theme==='light'?'light':'dark';
  document.querySelector('meta[name=theme-color]').content=cfg.theme==='light'?'#efe6d6':'#0d1210'}
function applyLang(){const en=cfg.lang==='en';document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';
  $$('[data-t]').forEach(el=>{const v=T(el.dataset.t);if(typeof v==='string')el.innerHTML=v});
  $('fName').placeholder=T('namePh');
  $$('.seg[data-k=arrive] button').forEach(b=>b.textContent=b.dataset.v+' '+T('m'));
  drawBezel();setTitle();}

/* ---------- compass bezel ---------- */
function drawBezel(){const s=$('bezelSvg');let h='<circle class="face" cx="100" cy="100" r="96" stroke-width="1.5"/>';
  for(let i=0;i<72;i++){const a=i*5,maj=a%30===0,r1=maj?82:86,r2=92,x=t=>100+t*Math.sin(rad(a)),y=t=>100-t*Math.cos(rad(a));
    h+='<line class="tick'+(maj?' maj':'')+'" x1="'+x(r1)+'" y1="'+y(r1)+'" x2="'+x(r2)+'" y2="'+y(r2)+'" stroke-width="'+(maj?2:1)+'" stroke-linecap="round"/>'}
  const lab=cfg.lang==='en'?['N','E','S','W']:['ش','ق','ج','غ'];
  [0,90,180,270].forEach((a,i)=>{const x=100+70*Math.sin(rad(a)),y=100-70*Math.cos(rad(a))+4;
    h+='<text class="card'+(i?'':' n')+'" x="'+x+'" y="'+y+'" text-anchor="middle" transform="rotate('+a+' '+x+' '+(y-4)+')">'+lab[i]+'</text>'});
  s.innerHTML=h}

/* ---------- coordinate display ---------- */
function dms(v,p,n){const h=v<0?n:p;v=Math.abs(v);let d=Math.floor(v),m=Math.floor((v-d)*60),s=((v-d)*60-m)*60;
  s=Math.round(s*10)/10;if(s>=60){s=0;m++}if(m>=60){m=0;d++}
  return d+'°'+String(m).padStart(2,'0')+'′'+s.toFixed(1).padStart(4,'0')+'″'+h}
const fmtLat=v=>cfg.fmt==='dms'?dms(v,'N','S'):v.toFixed(6);
const fmtLon=v=>cfg.fmt==='dms'?dms(v,'E','W'):v.toFixed(6);
const fmtLL=(a,b)=>cfg.fmt==='dms'?fmtLat(a)+' '+fmtLon(b):fmtLat(a)+', '+fmtLon(b);

/* ---------- storage ---------- */
function load(){try{places=JSON.parse(localStorage.getItem('sahm.places')||'[]');cur=localStorage.getItem('sahm.cur')||null}catch(e){places=[]}}
function save(){try{localStorage.setItem('sahm.places',JSON.stringify(places));localStorage.setItem('sahm.cur',cur||'')}catch(e){}}

/* ---------- geo math ---------- */
function distance(a,b){const dLat=rad(b.lat-a.lat),dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b.lon-a.lon))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lon-a.lon));
  return (deg(Math.atan2(y,x))+360)%360}
const dirName=b=>T('dirs')[Math.round(b/45)%8];
function fmtDist(m){return m<1000?{v:Math.round(m),u:T('m')}:{v:(m/1000).toFixed(m<10000?2:m<100000?1:0),u:T('km')}}
/* Accepts: 24.886, 46.648 | N 24.886 E 46.648 | 24.886N 46.648E | 24°53'09.6"N 46°38'54.2"E
   | N 24 53.160 E 046 38.904 | شمال 24.886 شرق 46.648 | Google / Apple Maps links */
function okLL(lat,lon){lat=+lat;lon=+lon;return isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180&&!(lat===0&&lon===0)?{lat,lon}:null}
function parseCoord(s){
  if(!s)return null;
  s=s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',').trim();
  try{s=decodeURIComponent(s)}catch(e){}
  if(/https?:|www\.|maps\.|goo\.gl/i.test(s)){
    let m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);                       // Google place pin
    if(!m)m=s.match(/[?&](?:q|ll|sll|query|destination|daddr|center|coordinate)=\s*(-?\d+\.\d+)\s*,\s*\+?\s*(-?\d+\.\d+)/i);
    if(!m)m=s.match(/\/(?:search|place|dir\/[^/]*)\/\s*(-?\d+\.\d+)\s*,\s*\+?\s*(-?\d+\.\d+)/);
    if(!m)m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);                          // map centre
    return m?okLL(m[1],m[2]):null;
  }
  let t=s.replace(/شمال/g,' N ').replace(/جنوب/g,' S ').replace(/شرق/g,' E ').replace(/غرب/g,' W ')
         .toUpperCase().replace(/[°º˚′’'″”"]/g,' ').replace(/[;,]/g,' ');
  const tok=t.match(/(?<![A-Z])[NSEW](?![A-Z])|-?\d+(?:\.\d+)?/g)||[];
  const letters=tok.filter(x=>/[NSEW]/.test(x));
  const toDeg=a=>{const n=a.map(Number);const sg=n[0]<0?-1:1;return sg*(Math.abs(n[0])+(n[1]||0)/60+(n[2]||0)/3600)};
  let groups=[];
  if(letters.length===2){
    const prefix=/[NSEW]/.test(tok[0]);let g=null;
    tok.forEach(x=>{if(/[NSEW]/.test(x)){if(prefix){g={h:x,n:[]};groups.push(g)}else{if(g){g.h=x;g=null}}}
      else{if(prefix){g&&g.n.push(x)}else{if(!g){g={n:[]};groups.push(g)}g.n.push(x)}}});
  }else if(letters.length===0){
    const n=tok;if(![2,4,6].includes(n.length))return null;const h=n.length/2;groups=[{n:n.slice(0,h)},{n:n.slice(h)}];
  }else return null;
  if(groups.length!==2||groups.some(g=>!g.n.length||g.n.length>3))return null;
  let lat=null,lon=null;
  groups.forEach((g,i)=>{let v=toDeg(g.n);if(g.h==='S'||g.h==='W')v=-Math.abs(v);
    if(g.h==='N'||g.h==='S')lat=v;else if(g.h==='E'||g.h==='W')lon=v;else if(i===0)lat=v;else lon=v});
  return lat==null||lon==null?null:okLL(lat,lon);
}

/* ---------- GPS ---------- */
let gpsErr=null;
function gpsQuality(acc,stale){
  if(acc==null)return{n:0,t:gpsErr?T(gpsErr):T('gWait'),c:gpsErr?'var(--bad)':'var(--dim)'};
  if(stale)return{n:1,t:T('gStop'),c:'var(--bad)'};
  if(acc<=6)return{n:4,t:T('gEx'),c:'var(--good)'};
  if(acc<=15)return{n:3,t:T('gGood'),c:'var(--good)'};
  if(acc<=40)return{n:2,t:T('gMid'),c:'var(--ok)'};
  return{n:1,t:T('gWeak'),c:'var(--bad)'}}
/* Use each GPS fix as it comes, no smoothing: smoothing made the position lag a few metres behind you.
   While "Save my location" is open, fixes are collected and averaged (better ones count more). */
let avgBuf=null;
function onPos(p){
  const c=p.coords, now=p.timestamp||Date.now();gpsErr=null;
  pos={lat:c.latitude,lon:c.longitude,acc:c.accuracy,alt:c.altitude,speed:c.speed,course:c.heading,t:now};
  if(avgBuf&&c.accuracy<=40){avgBuf.push(pos);showAvg()}
  render();
}
function avgFix(b){let w=0,la=0,lo=0,best=Infinity;b.forEach(f=>{const k=1/(f.acc*f.acc);w+=k;la+=f.lat*k;lo+=f.lon*k;best=Math.min(best,f.acc)});
  return{lat:la/w,lon:lo/w,n:b.length,acc:best}}
function showAvg(){if(!avgBuf||!avgBuf.length||avgBuf.edited)return;const a=avgFix(avgBuf.slice(-30));
  $('fCoord').value=a.lat.toFixed(6)+', '+a.lon.toFixed(6);preview();
  $('fAvg').textContent=T('avg')(a.n,Math.round(a.acc));$('fAvg').hidden=false}
function onErr(e){gpsErr=e.code===1?'gPerm':'gNone';render()}

/* ---------- compass ---------- */
let compAcc=null, compAccT=0, drift=null, driftT=0; // compass accuracy (°) from iOS, and gap between compass and walking direction
function compassBad(){const now=Date.now();
  if(drift!=null&&now-driftT>8000)drift=null;
  if(compAcc!=null&&now-compAccT>3000)compAcc=null;
  return (compAcc!=null&&(compAcc<0||compAcc>25))||(drift!=null&&drift>40)}
function onOrient(e){let h=null;
  if(e.webkitCompassAccuracy!=null){compAcc=e.webkitCompassAccuracy;compAccT=Date.now()}
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
  if(h==null)return;compassOK=true;
  const so=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
  heading=(h+so+360)%360;render()}

/* ---------- render ---------- */
const turn=(c,t)=>c==null?t:c+((t-c+540)%360)-180; // shortest way round
function target(){if(tab==='qibla')return{name:T('kaaba'),lat:KAABA.lat,lon:KAABA.lon,qibla:true};
  if(tab==='home')return places.find(p=>p.id===cur)||null;return null}
function render(){
  const age=pos?(Date.now()-pos.t)/1000:null, stale=age!=null&&age>10;
  const q=gpsQuality(pos&&pos.acc,stale);
  [...$('bars').children].forEach((b,i)=>b.style.background=i<q.n?q.c:'var(--line)');
  $('gpsLabel').textContent=q.t;$('gpsLabel').style.color=q.c;
  $('acc').textContent=pos?'±'+Math.round(pos.acc)+' m':'';
  if(compassOK&&pos&&pos.speed>1.5&&pos.course!=null&&!isNaN(pos.course)&&!stale){
    const g=Math.abs(((heading-pos.course+540)%360)-180);drift=drift==null?g:drift*.6+g*.4;driftT=Date.now()}
  const bad=compassOK&&compassBad();
  const cTxt=!compassOK?T('cOff'):compAcc==null?T('cOn'):compAcc<0?T('cCal'):T('cAcc')(Math.round(compAcc));
  $('fixInfo').innerHTML=(pos?'<span class="dot" style="background:'+(stale?'var(--bad)':'var(--good)')+'"></span>'+(age<2?T('live'):T('ago')(Math.round(age)))+' · ':'')+
    '<span style="color:'+(bad||!compassOK?'var(--bad)':'inherit')+'">'+cTxt+'</span>';
  if(tab!=='home'&&tab!=='qibla')return;

  const t=target(), nav=!!t;
  $('here').hidden=nav;['dial','dist','meta','navhead'].forEach(id=>$(id).hidden=!nav);$('cancel').hidden=!(nav&&!t.qibla);
  $('stage').classList.toggle('qibla',!!(t&&t.qibla));
  if(!nav){
    $('stage').classList.remove('arrived','aligned');$('warn').textContent=pos&&pos.acc>40?T('wWeakMove'):'';
    if(!pos){$('coords').textContent='--';return}
    $('coords').innerHTML=fmtLat(pos.lat)+(cfg.fmt==='dms'?'<br>':',<br>')+fmtLon(pos.lon);
    $('hAcc').textContent='±'+Math.round(pos.acc)+' m';
    $('hAlt').textContent=pos.alt!=null?Math.round(pos.alt)+' m':'--';
    $('hSpd').textContent=pos.speed!=null&&pos.speed>=0?(pos.speed*3.6).toFixed(1)+' km/h':'--';
    return;
  }
  $('navhead').textContent=t.qibla?T('qiblaHead'):T('navTo');
  const name=document.createElement('b');name.textContent=t.name;
  if(!pos){$('dist').textContent='--';$('meta').replaceChildren(name);return}
  const d=distance(pos,t),b=bearing(pos,t),f=fmtDist(d);
  $('dist').innerHTML=f.v+'<small>'+f.u+'</small>';
  $('meta').replaceChildren(name,' · '+dirName(b)+' '+Math.round(b)+'°');
  let h=heading,warn='';
  if(!compassOK){if(pos.course!=null&&!isNaN(pos.course)&&pos.speed>1){h=pos.course;warn=T('wMove')}else{h=0;warn=T('wNorth')}}
  if(bad)warn=T('wComp');
  if(pos.acc>40&&!t.qibla)warn=T('wApprox');
  if(stale)warn=T('wStop');
  $('warn').textContent=warn;
  const rel=(b-h+360)%360;
  smooth=turn(smooth,rel);smoothB=turn(smoothB,(360-h)%360);
  $('arrow').style.transform='rotate('+smooth+'deg)';
  $('bezel').style.transform='rotate('+smoothB+'deg)';
  $('stage').classList.toggle('aligned',!bad&&(rel<(t.qibla?5:12)||rel>(t.qibla?355:348)));
  if(t.qibla){arrived=false}else{const ar=cfg.arrive,leave=ar+Math.max(1,ar*0.3);if(arrived?d>leave:d<=ar)arrived=!arrived}
  $('stage').classList.toggle('arrived',arrived);
}
setInterval(render,1000);

/* ---------- tabs ---------- */
function setTitle(){$('ptitle').textContent=tab==='home'?'':T({set:'tabSet',qibla:'tabQibla',fav:'tabFav'}[tab])}
function go(name){tab=name;smooth=null;smoothB=null;arrived=false;
  $$('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  $('stage').hidden=!(name==='home'||name==='qibla');$('pFav').hidden=name!=='fav';$('pSet').hidden=name!=='set';
  if(name==='fav')fillList();if(name==='set')paintSet();
  setTitle();render()}
$$('#tabbar button').forEach(b=>b.onclick=()=>go(b.dataset.tab));

/* ---------- places ---------- */
function toast(s){const t=$('toast');t.textContent=s;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1700)}
function copy(s){if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast(T('copied'))).catch(()=>toast(s));else toast(s)}
/* date & time saved with each place, as local "YYYY-MM-DD HH:MM" (empty for places saved before 1.7) */
const pad=n=>String(n).padStart(2,'0');
function stamp(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function showAt(at){const m=at&&at.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/);if(!m)return '';
  let h=+m[4];const ap=h<12?T('am'):T('pm');h=h%12||12;return m[3]+'/'+m[2]+'/'+m[1]+' · '+h+':'+m[5]+' '+ap}
function navigateTo(id){cur=id||null;save();go('home')}
function addPlace(name,c,at){const p={id:Date.now().toString(36),name:name||T('place'),lat:c.lat,lon:c.lon,at:at===undefined?stamp():at};places.push(p);save();return p}
function preview(){const c=parseCoord($('fCoord').value);$('fErr').textContent='';$('fPrev').textContent=c?'✓ '+c.lat.toFixed(6)+', '+c.lon.toFixed(6):''}
$('fCoord').oninput=preview;
function openAdd(prefill,fix){avgBuf=fix?[fix]:null;$('fAvg').hidden=true;$('fName').value='';$('fCoord').value=prefill||'';preview();if(fix)showAvg();openAdd.at=stamp();$('fAt').textContent=showAt(openAdd.at);$('dlgAdd').showModal()}
$$('.addCoord').forEach(b=>b.onclick=()=>openAdd(''));
$$('.saveHere').forEach(b=>b.onclick=()=>{if(!pos){toast(T('waitGps'));return}openAdd('',pos)});
$('fOk').onclick=()=>{const v=$('fCoord').value,c=parseCoord(v);
  if(!c){$('fErr').textContent=/goo\.gl|maps\.app/i.test(v)?T('errShort'):T('errBad');return}
  addPlace($('fName').value.trim(),c,openAdd.at);$('dlgAdd').close();
  if(tab==='fav')fillList();else go('fav')};
$('fCancel').onclick=()=>$('dlgAdd').close();
$('dlgAdd').addEventListener('close',()=>{avgBuf=null});
$('fCoord').addEventListener('input',()=>{if(avgBuf){avgBuf.edited=true;$('fAvg').hidden=true}});
$('cancel').onclick=()=>{cur=null;save();arrived=false;smooth=null;render();toast(T('canceled'))};
$('copyHere').onclick=()=>{if(pos)copy(fmtLL(pos.lat,pos.lon))};
function fillList(){const Ls=$('list');Ls.innerHTML='';
  if(!places.length){Ls.innerHTML='<div class="empty">'+T('empty')+'</div>';return}
  places.slice().reverse().forEach(p=>{const it=document.createElement('div');it.className='item';
    it.innerHTML='<div class="txt"><b></b><small></small><div class="at"></div></div><div class="acts"><button class="primary" data-a="go"></button><button data-a="copy"></button><button class="del" data-a="del"></button></div>';
    it.querySelector('b').textContent=p.name;it.querySelector('small').textContent=fmtLL(p.lat,p.lon);it.querySelector('.at').textContent=showAt(p.at);
    const bGo=it.querySelector('[data-a=go]'),bC=it.querySelector('[data-a=copy]'),bD=it.querySelector('[data-a=del]');
    bGo.textContent=T('go');bC.textContent=T('copy');bD.textContent=T('del');
    bGo.onclick=()=>navigateTo(p.id);
    bC.onclick=()=>copy(fmtLL(p.lat,p.lon));
    // delete needs a second tap within 3 s
    bD.onclick=()=>{if(!bD.classList.contains('sure')){bD.classList.add('sure');bD.textContent=T('sure');
        setTimeout(()=>{bD.classList.remove('sure');bD.textContent=T('del')},3000);return}
      places=places.filter(x=>x.id!==p.id);if(cur===p.id)cur=null;save();fillList()};
    Ls.appendChild(it)})}

/* ---------- backup / restore: plain text, one place per line ---------- */
function backupText(){return T('backupTitle')+'\n'+places.map(p=>p.name+': '+p.lat.toFixed(6)+', '+p.lon.toFixed(6)+(p.at?' | '+p.at:'')).join('\n')}
$('backup').onclick=async()=>{
  if(!places.length){toast(T('noPlaces'));return}
  const text=backupText();
  if(navigator.share){try{await navigator.share({title:T('backupTitle'),text});return}catch(e){if(e.name==='AbortError')return}}
  copy(text)};
$('restore').onclick=()=>{$('rText').value='';$('rErr').textContent='';$('dlgRestore').showModal()};
$('rCancel').onclick=()=>$('dlgRestore').close();
$('rOk').onclick=()=>{
  let added=0,skipped=0;
  $('rText').value.split(/\r?\n/).forEach((line,i)=>{
    line=line.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/،/g,',').trim();
    // "name: lat, lon" (old backups) or "name: lat, lon | YYYY-MM-DD HH:MM" (1.7+)
    let at='';const dm=line.match(/\s*\|\s*(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*$/);
    if(dm){at=dm[1];line=line.slice(0,dm.index)}
    const m=line.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/);if(!m)return;
    const c=okLL(m[1],m[2]);if(!c)return;
    const name=line.slice(0,m.index).replace(/[\s:|\-–—]+$/,'').trim()||T('place');
    if(places.some(p=>Math.abs(p.lat-c.lat)<1e-6&&Math.abs(p.lon-c.lon)<1e-6)){skipped++;return}
    places.push({id:Date.now().toString(36)+i,name,lat:c.lat,lon:c.lon,at});added++;
  });
  if(!added&&!skipped){$('rErr').textContent=T('restoreErr');return}
  save();fillList();$('dlgRestore').close();toast(T('restored')(added,skipped))};

/* ---------- settings ---------- */
function paintSet(){$$('.seg').forEach(s=>{const k=s.dataset.k;s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(cfg[k])===b.dataset.v))})}
$$('.seg button').forEach(b=>b.onclick=()=>{
  const k=b.parentNode.dataset.k,v=b.dataset.v;cfg[k]=k==='arrive'?+v:v;saveCfg();
  if(k==='theme')applyTheme();if(k==='lang')applyLang();
  paintSet();render()});
$('share').onclick=async()=>{const url=location.href.split('#')[0];
  if(navigator.share){try{await navigator.share({title:T('appName'),text:T('shareText'),url});return}catch(e){if(e.name==='AbortError')return}}
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast(T('linkCopied'))).catch(()=>toast(url));else toast(url)};
$('aboutBtn').onclick=()=>$('dlgAbout').showModal();
$('aClose').onclick=()=>$('dlgAbout').close();

/* ---------- start (iOS needs a tap to grant compass) ---------- */
async function wakeOn(){try{await navigator.wakeLock.request('screen')}catch(e){}}
async function start(){
  $('start').hidden=true;
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{const r=await DeviceOrientationEvent.requestPermission();if(r==='granted')addEventListener('deviceorientation',onOrient)}catch(e){}
  }else{addEventListener('deviceorientationabsolute',onOrient);addEventListener('deviceorientation',onOrient)}
  if('geolocation' in navigator)navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  else onErr({code:2});
  wakeOn();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeOn()});
}
$('go').onclick=start;

load();applyTheme();applyLang();
const hh=decodeURIComponent(location.hash.slice(1));const hc=hh&&parseCoord(hh);
if(hc){let p=places.find(x=>Math.abs(x.lat-hc.lat)<1e-6&&Math.abs(x.lon-hc.lon)<1e-6);if(!p)p=addPlace(T('fromLink'),hc);cur=p.id;save()}
go('home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
